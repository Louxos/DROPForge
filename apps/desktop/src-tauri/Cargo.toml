# Application Windows de DropForge.
#
# Ce fichier a été compilé pour la première fois par la chaîne d'intégration, sur une
# machine Windows (`.github/workflows/release.yml`), faute de chaîne d'outils Rust dans
# l'environnement de développement utilisé : voir docs/TECHNIQUE.md. Localement,
# `npm run build:windows` (à la racine du dépôt) fait la même chose.
[package]
name = "dropforge"
version = "0.1.2"
description = "Transfert de fichiers entre appareils, sans compte, chiffré de bout en bout."
authors = ["DropForge"]
edition = "2021"
# Les greffons officiels utilisés ici (SQL, mise à jour, instance unique) demandent
# Rust 1.90 ou plus récent : la version minimale déclarée le dit, au lieu de laisser
# croire à une compatibilité plus large qui n'existe pas.
rust-version = "1.90"
# Licence du projet : pas encore choisie (voir docs/TECHNIQUE.md pour les licences des
# dépendances). Aucun champ `license` ni `license-file` n'est renseigné : Cargo n'a
# donc rien à valider, et rien ne pointe vers un fichier inexistant.

[lib]
# Nécessaire pour que la logique soit testable sans lancer de fenêtre.
name = "dropforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
# Une seule instance à la fois : une seconde tentative de lancement ramène la fenêtre
# existante au premier plan au lieu de créer un processus invisible.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[features]
# La distribution par défaut n'embarque pas les outils de développement.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Une application qui transfère des fichiers ne doit pas être plus grosse que
# nécessaire : la taille du binaire compte pour un installateur Windows.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
