<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropForge</title>
    <meta name="theme-color" content="#0b0b0f" />
    <!-- Aucune ressource distante : l'application Windows doit fonctionner hors ligne. -->
    <style>
      /* Affiché uniquement le temps du premier rendu de React, qui le remplace.
         Il sert de diagnostic : si ce texte reste visible, c'est que l'interface n'a
         pas démarré — et la fenêtre s'affiche quand même (contrôle de secours côté
         Rust), au lieu d'un rectangle vide. */
      html,
      body {
        margin: 0;
        background: #0b0b0f;
        color: #f4f4f7;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #df-boot {
        display: grid;
        gap: 18px;
        padding: 32px;
      }
      /* Le logo, écrit par `scripts/generate-icons.mjs` entre ses deux repères : le
         même tracé que l'icône de l'exécutable, jamais un « DF » de remplacement. */
      #df-boot__mark {
        display: inline-block;
        width: 40px;
        height: 40px;
        line-height: 0;
      }
      #df-boot__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #df-boot__title {
        color: #a5a5b4;
      }
      #df-boot__hint {
        color: #6f6f80;
        font-size: 12px;
      }
      #df-boot__failure {
        max-width: 46rem;
        padding: 14px 16px;
        border: 1px solid #6b2b2b;
        border-left: 3px solid #ff6b6b;
        border-radius: 10px;
        background: #1a0f12;
        color: #ffd9d9;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #df-boot__failure button {
        margin-top: 10px;
        padding: 7px 12px;
        border: 1px solid #6b2b2b;
        border-radius: 8px;
        background: #24151a;
        color: #ffd9d9;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="df-boot"><span id="df-boot__mark" aria-hidden="true"><!-- DROPFORGE_MARK:START -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="40" height="40" aria-hidden="true">
  <defs>
    <linearGradient id="df" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#389cff" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b0f" />
  <path d="M256 112 L368 272 L144 272 Z" fill="url(#df)" />
  <rect x="238" y="312" width="36" height="88" rx="10" fill="url(#df)" />
</svg>
          <!-- DROPFORGE_MARK:END --></span><strong id="df-boot__title">DropForge — démarrage…</strong><span id="df-boot__hint">Si ce message reste affiché, l’interface n’a pas pu démarrer ; le journal de diagnostic se trouve dans %APPDATA%\org.dropforge.app\diagnostics.log</span></div></div>
    <noscript>DropForge a besoin de JavaScript pour chiffrer et transférer vos fichiers.</noscript>
    <!-- Contrôle de secours de l'interface, exécuté AVANT le paquet de l'application.
         Il n'importe rien : il ne peut donc pas échouer pour la même raison que ce
         qu'il surveille. Si le paquet ne démarre pas — fichier manquant, erreur de
         syntaxe, exception avant le premier rendu — ce bloc remplace l'écran de
         démarrage et **écrit la cause** au lieu de faire tourner un indicateur pour
         toujours, et la consigne dans le journal de diagnostic.
         Voir `docs/TROUBLESHOOTING.md`, section « l'écran de démarrage reste affiché ». -->
    <script>
      (function () {
        var failures = [];
        var MAX = 6;
        var JOURNAL = '%APPDATA%\\org.dropforge.app\\diagnostics.log';

        function remember(message) {
          var text = String(message || 'erreur sans message');
          if (failures.indexOf(text) !== -1) return;
          if (failures.length < MAX) failures.push(text);
          window.setTimeout(show, 0);
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (event && event.message) remember(event.message);
            else if (target && target.src) remember('fichier introuvable : ' + target.src);
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          remember('promesse rejetée : ' + ((reason && reason.message) || reason || 'sans détail'));
        });

        // Un fichier de l'interface qui ne se charge pas ne produit aucune erreur
        // visible du reste de la page : il faut l'écouter sur la balise elle-même.
        window.addEventListener('DOMContentLoaded', function () {
          var scripts = document.querySelectorAll('script[type="module"]');
          for (var i = 0; i < scripts.length; i += 1) {
            scripts[i].addEventListener('error', function (event) {
              var src = event && event.target && event.target.src ? event.target.src : "paquet de l'interface";
              remember('chargement impossible : ' + src);
            });
          }
        });

        function report() {
          var internals = window.__TAURI_INTERNALS__;
          if (!internals || typeof internals.invoke !== 'function') return;
          try {
            internals.invoke('report_problem', {
              scope: 'splash',
              message: failures.length > 0 ? failures.join(' · ') : "l'interface n'a pas démarré",
            });
          } catch (error) {
            /* le contrôle de secours ne fait jamais tomber la page */
          }
        }

        function show() {
          var boot = document.getElementById('df-boot');
          if (!boot) return; // React a monté l'interface : il n'y a rien à signaler.
          var box = document.getElementById('df-boot__failure');
          if (!box) {
            box = document.createElement('div');
            box.id = 'df-boot__failure';
            var button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Copier ce détail';
            button.addEventListener('click', function () {
              var text = box.getAttribute('data-detail') || '';
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text);
                  button.textContent = 'Copié';
                  return;
                }
              } catch (error) {
                /* le presse-papiers peut être refusé : le texte reste sélectionnable */
              }
              button.textContent = 'Sélectionnez le texte ci-dessus';
            });
            box.appendChild(button);
            boot.appendChild(box);
          }
          var detail =
            "L'interface n'a pas démarré : " +
            (failures.length > 0 ? failures.join(' · ') : 'aucune erreur rapportée') +
            '.\nLe détail est écrit dans ' + JOURNAL + '.';
          box.setAttribute('data-detail', detail);
          var button = box.querySelector('button');
          box.textContent = detail + '\n';
          if (button) box.appendChild(button);
          report();
        }

        // Une erreur connue s'affiche tout de suite ; sinon, l'écran de démarrage
        // cède la place à ce diagnostic au bout de 15 secondes. Si l'interface
        // démarre entre-temps, elle remplace `#root` et ce bloc disparaît avec.
        window.setTimeout(show, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
