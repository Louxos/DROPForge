# Publication d'une version : c'est le moyen officiel de télécharger DropForge.
#
#   git tag v0.1.3 && git push origin v0.1.3
#
# Ce qu'une version contient, et rien d'autre :
#
#   - dropforge-pwa-<version>.zip        (application web, servable partout)
#   - dropforge-signaling-<version>.zip  (serveur optionnel, Node pur)
#   - SHA256SUMS                         (sommes de contrôle des deux archives)
#
# DropForge est une application web installable (PWA) : il n'y a plus d'installateur à
# compiler, donc plus de machine Windows ni de chaîne d'outils Rust ici. Cette chaîne ne
# construit que ce qu'elle publie.
name: Release


on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify

  web:
    name: Application web et serveur
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compilation et paquets
        env:
          # L'archive distribuée doit fonctionner servie depuis n'importe quel
          # dossier : les chemins sont donc relatifs.
          DROPFORGE_BASE: ./
        run: npm run package
      - name: Sommes de contrôle
        run: cd release && sha256sum -c SHA256SUMS
      - name: Test des paquets avant publication
        run: npm run smoke:release
      - uses: actions/upload-artifact@v7
        with:
          name: paquets-web
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publication de la version
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          # Une version dont le tag contient un tiret (v0.1.0-preview) est publiée
          # comme pré-version : elle ne sera pas proposée comme « dernière version ».
          case "$TAG" in *-*) FLAGS="--prerelease" ;; *) FLAGS="" ;; esac
          # Les notes vivent dans le dépôt (`CHANGELOG.md`) : la page de téléchargement dit
          # alors ce qui a changé et ce qui n'est pas encore prouvé, au lieu d'une phrase
          # générique. La section du tag (« ## [0.1.2] … ») est extraite telle quelle,
          # jusqu'à la section suivante ; à défaut, une note minimale est utilisée.
          VERSION="${TAG#v}"
          NOTES_FILE="release-notes.md"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            NOTES=(--notes-file "$NOTES_FILE")
            echo "Notes de version : section [$VERSION] de CHANGELOG.md"
          else
            rm -f "$NOTES_FILE"
            NOTES=(--notes "Application web installable et serveur optionnel. Vérifiez les sommes de contrôle avec \`sha256sum -c SHA256SUMS\`.")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" "${NOTES[@]}"
          else
            gh release create "$TAG" \
              --title "DropForge ${TAG#v}" \
              "${NOTES[@]}" \
              $FLAGS \
              assets/*
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
