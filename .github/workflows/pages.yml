# Publication de l'application web (PWA) sur GitHub Pages.
#
# C'est la façon la plus simple de « télécharger » DropForge sans installer quoi que
# ce soit : l'adresse publiée s'installe comme une application.
#
# Prérequis, une seule fois : dépôt → Settings → Pages → Source = « GitHub Actions ».
# Le chemin de base est celui du dépôt (`/NOM_DU_DEPOT/`), calculé automatiquement.
name: Application web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Compilation avec le chemin du dépôt
        env:
          DROPFORGE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:web
      - name: Pages est-il activé ?
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Pages demande une activation manuelle, une seule fois. Tant qu'elle
          # n'a pas eu lieu, échouer à chaque envoi serait du bruit : on le dit, et on
          # s'arrête là. Dès que Pages est activé, un nouvel envoi (ou « Re-run »)
          # publie l'application — rien d'autre à changer.
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages n'est pas activé pour ce dépôt. Activez-le (Settings → Pages → Source : « GitHub Actions »), puis relancez ce travail : l'application web sera publiée et installable depuis son adresse."
          fi
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/dist

  deploy:
    name: Publication
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
