# Le site DropForge, publié sur GitHub Pages — le seul hébergement du projet.
#
# Ce que ce site contient, et rien d'autre :
#
#   /                 la page d'archive (projet arrêté, code source, historique)
#   /app/             l'application web installable (PWA)
#   404.html          la page servie pour toute adresse inconnue
#
# Ce workflow a construit, vérifié et publié ce site jusqu'à la 0.2.0, à chaque envoi sur
# `main`, puis relu l'adresse publique. Prérequis, une seule fois : dépôt → Settings →
# Pages → Source = « GitHub Actions » ; sans ce réglage, la tâche échoue avec le geste
# exact plutôt que de faire croire à un déploiement qui n'a pas eu lieu.
#
# Le chemin de base est celui du dépôt (`/NOM-DU-DEPOT/`), calculé ici : une fourche se
# publie correctement sans modifier un seul fichier.
#
# **Depuis le 4 novembre 2026, il ne publie plus rien** : le projet est archivé, et un
# dépôt archivé n'exécute plus ses workflows. GitHub Pages sert désormais les fichiers
# versionnés à la racine de la branche (`index.html`, `404.html`, `favicon.svg`, `app/`,
# `.nojekyll`), écrits par `npm run publish:site` et comparés octet par octet par
# `npm run check:pages`. Ce fichier reste dans le dépôt comme trace de la chaîne
# précédente.
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois. `cancel-in-progress: false` : une publication
# interrompue au milieu laisse le site dans l'état précédent, ce qui est préférable à un
# site à moitié remplacé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construction du site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: GitHub Pages est-il réglé sur « GitHub Actions » ?
        # Le seul réglage qu'une Action ne peut pas faire à la place du propriétaire
        # (le jeton par défaut n'a pas le droit d'activer Pages). Sans ce contrôle, la
        # panne arrive à la fin, sous la forme d'une erreur de l'action de publication,
        # et personne ne sait quoi cliquer. Ici, elle est dite au début, avec le geste.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo 'absent')
          if [ "$build_type" != 'workflow' ]; then
            echo "::error::GitHub Pages ne publie pas depuis GitHub Actions (build_type=${build_type}). Ouvrez Settings → Pages → Build and deployment → Source, choisissez « GitHub Actions », puis relancez ce travail (Actions → Site (GitHub Pages) → Run workflow)."
            exit 1
          fi
          echo "::notice::GitHub Pages publie depuis GitHub Actions."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Types, contrôles et tests
        # `verify` construit le site et le sert sous son chemin réel avant les tests :
        # un chemin cassé est vu ici, pas en ligne.
        run: npm run verify

      - name: Chemin du site
        id: base
        shell: bash
        run: |
          # Un dépôt `<compte>.github.io` est servi à la racine du domaine ; tout autre
          # dépôt est servi sous `/<dépôt>/`. Le site en dépend entièrement.
          repository="${{ github.event.repository.name }}"
          if [[ "$repository" == *.github.io ]]; then
            base="/"
          else
            base="/$repository/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=https://${{ github.repository_owner }}.github.io$base" >> "$GITHUB_OUTPUT"
          echo "::notice::Site publié sous $base"

      - name: Site complet (accueil, page 404 et application)
        env:
          # Les variables du dépôt l'emportent : domaine personnalisé (`/`) ou adresse
          # particulière. Sans elles, le chemin du dépôt et l'adresse github.io.
          DROPFORGE_PAGES_BASE: ${{ vars.DROPFORGE_PAGES_BASE || steps.base.outputs.base }}
          DROPFORGE_SITE_URL: ${{ vars.DROPFORGE_SITE_URL || steps.base.outputs.url }}
          # Facultatif, réglé une fois dans Settings → Variables : sans ces valeurs,
          # l'application publiée n'a **aucun** relais et le dit (deux appareils du même
          # Wi-Fi fonctionnent quand même). Voir docs/TECHNIQUE.md § 11.
          VITE_SIGNALING_URL: ${{ vars.DROPFORGE_SIGNALING_URL }}
          VITE_ICE_URLS: ${{ vars.DROPFORGE_ICE_URLS }}
        run: npm run build:pages

      - name: Contrôle du site, sous son adresse réelle
        # Chaque fichier référencé est demandé à travers le chemin du dépôt : c'est la
        # vérification qui attrape un préfixe oublié, un manifeste hors périmètre ou un
        # service worker qui pointe ailleurs.
        run: node scripts/check-pages.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Vérification du site publié
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Le site en ligne répond, se charge et dit la vérité sur ses 404
        # Les mêmes contrôles que localement, sur l'adresse réellement publiée : une
        # publication n'est annoncée réussie qu'après avoir été lue depuis Internet.
        run: node scripts/check-pages.mjs --url "${{ needs.deploy.outputs.page_url }}"
