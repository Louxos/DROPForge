# Publication de l'application web (PWA) sur GitHub Pages.
#
# C'est la façon la plus simple de « télécharger » DropForge sans installer quoi que
# ce soit : l'adresse publiée s'installe comme une application.
#
# Prérequis, une seule fois : dépôt → Settings → Pages → Source = « GitHub Actions ».
# Le chemin de base est celui du dépôt (`/NOM_DU_DEPOT/`), calculé automatiquement.
name: Application web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Compilation avec le chemin du dépôt
        env:
          DROPFORGE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:web
      - name: Pages est-il activé ?
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Pages demande une activation manuelle, une seule fois — et **un choix
          # de source** : « GitHub Actions » publie l'application elle-même, « Deploy
          # from a branch » publie la page d'accueil. Les deux s'excluent, donc ce
          # travail ne déploie que dans le premier cas. Dans le second, il le dit et
          # s'arrête : échouer à chaque envoi alors que la page est publiée par ailleurs
          # serait du bruit, et un travail rouge sur `main` ne se lit plus.
          #
          # Le test porte sur le **type de construction**, pas sur l'existence du site :
          # un Pages réglé sur une branche répond lui aussi, et c'est exactement ce qui
          # faisait échouer la publication.
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo 'absent')
          if [ "$build_type" = 'workflow' ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages publie depuis une branche (build_type=${build_type}) : il n'y a rien à déployer ici, c'est la branche enregistrée comme source qui publie la page d'accueil. Pour publier l'application web elle-même par cette chaîne, passez Settings → Pages → Source sur « GitHub Actions », puis relancez ce travail."
          fi
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/dist

  deploy:
    name: Publication
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
