<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="DropForge — projet archivé le 4 novembre 2026">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#389cff" />
    </linearGradient>
    <linearGradient id="closed-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" />
      <stop offset="0.34" stop-color="#ff5a4d" />
      <stop offset="0.72" stop-color="#ff8a3d" />
      <stop offset="1" stop-color="#ffc46b" />
    </linearGradient>
    <radialGradient id="halo-closed" cx="0.16" cy="0.08" r="0.95">
      <stop offset="0" stop-color="#ff5a4d" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ff5a4d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo-ember" cx="0.98" cy="1" r="0.8">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.26" />
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="#08080b" />
  <rect width="1200" height="280" fill="url(#halo-closed)" />
  <rect width="1200" height="280" fill="url(#halo-ember)" />
  <rect x="0" y="0" width="1200" height="3" fill="url(#closed-bar)" />
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" stroke="#ffffff" stroke-opacity="0.09" />

  <!-- Le logo, copié à l'identique depuis apps/web/public/icons/icon.svg : il garde
       les couleurs de DropForge, celles du sceau disent l'état. -->
  <g transform="translate(72 88) scale(0.203125)">
    <rect width="512" height="512" rx="112" fill="#0b0b0f" />
    <path d="M256 112 L368 272 L144 272 Z" fill="url(#accent)" />
    <rect x="238" y="312" width="36" height="88" rx="10" fill="url(#accent)" />
  </g>

  <text x="204" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.4" fill="#f4f4f8">DropForge</text>
  <text x="206" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#85859a">Transfert de fichiers chiffré de bout en bout, sans compte</text>

  <!-- Le sceau : fermé, daté, public. -->
  <g>
    <rect x="846" y="70" width="300" height="140" rx="16" fill="#ff5a4d" fill-opacity="0.07" stroke="#ff5a4d" stroke-opacity="0.55" />
    <rect x="854" y="78" width="284" height="124" rx="12" fill="none" stroke="#ff5a4d" stroke-opacity="0.22" />
    <circle cx="873" cy="107" r="4" fill="#ff5a4d" />
    <text x="886" y="112" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3.4" fill="#ff8a3d">PROJET ARCHIVÉ</text>
    <text x="870" y="155" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.6" fill="#f4f4f8">4 novembre 2026</text>
    <text x="870" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#b9b9c9">Dépôt public · lecture seule</text>
  </g>
</svg>
