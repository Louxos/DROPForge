# L'application web et le relais sur la même origine.
#
# Le serveur de signalisation est facultatif : sans lui, tout fonctionne sur le
# réseau local. Avec lui, deux appareils de réseaux différents peuvent se joindre.
upstream dropforge_signaling {
  server signaling:8787;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Aucune information sur la version du serveur, aucun journal de requête qui
  # contiendrait autre chose que l'adresse et le code de retour.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Le service worker doit être revalidé, sinon une ancienne interface survit aux
  # mises à jour.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Les fichiers dont le nom contient leur empreinte peuvent être mis en cache
  # indéfiniment.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /ws {
    proxy_pass http://dropforge_signaling;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /health {
    proxy_pass http://dropforge_signaling/health;
  }

  # Application web progressive : toute route inconnue sert l'interface, qui gère
  # elle-même sa navigation.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
